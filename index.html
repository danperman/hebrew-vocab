<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dictation — Time Expressions</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23c4b5fd'/><stop offset='1' stop-color='%237c3aed'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='url(%23g)'/><g transform='translate(50,50) rotate(-35)'><rect x='-9' y='-30' width='18' height='38' rx='3' fill='%23fff'/><polygon points='-9,8 9,8 0,26' fill='%23fde68a'/><rect x='-9' y='4' width='18' height='6' fill='%23f0abfc'/><rect x='-9' y='-30' width='18' height='8' rx='3' fill='%23e0e0e0'/></g></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f1a;
      color: #e8e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      text-align: center;
      padding: 1.8rem 1rem 1rem;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-bottom: 1px solid #2a2a4a;
    }

    header h1 { font-size: 1.6rem; color: #a78bfa; }
    header p  { color: #7c7c9a; margin-top: 0.3rem; font-size: 0.85rem; }

    .tabs {
      display: flex; gap: 0.4rem;
      margin: 1.2rem 0 0;
      background: #16213e;
      padding: 0.3rem;
      border-radius: 12px;
    }

    .tab {
      padding: 0.45rem 1.1rem;
      border: none; border-radius: 9px;
      background: transparent; color: #7c7c9a;
      cursor: pointer; font-size: 0.88rem;
      transition: all 0.2s;
    }

    .tab.active { background: #a78bfa; color: #fff; font-weight: 600; }

    main {
      width: 100%;
      max-width: 600px;
      padding: 2rem 1rem;
    }

    /* ── SHARED ── */
    .area { display: none; flex-direction: column; gap: 1.4rem; }
    .area.visible { display: flex; }

    .progress-wrap { width: 100%; background: #1e1e30; border-radius: 99px; height: 5px; }
    .progress-fill { height: 5px; background: #a78bfa; border-radius: 99px; transition: width 0.4s ease; }

    .top-row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.82rem; color: #7c7c9a;
    }

    .score-badge {
      background: #1e1e38; border: 1px solid #3a3a5c;
      padding: 0.25rem 0.7rem; border-radius: 99px;
      font-size: 0.82rem; color: #a78bfa; font-weight: 600;
    }

    /* ── DICTATION ── */
    .he-card {
      background: linear-gradient(135deg, #1e1e38, #252548);
      border: 1px solid #3a3a5c;
      border-radius: 20px;
      padding: 2.5rem 2rem;
      text-align: center;
    }

    .he-label {
      font-size: 0.72rem; text-transform: uppercase;
      letter-spacing: 0.12em; color: #6b6b8a; margin-bottom: 0.8rem;
    }

    .he-word {
      font-size: 2.6rem; font-weight: 700;
      color: #c4b5fd; direction: rtl;
      font-family: 'David Libre', 'Times New Roman', serif;
      line-height: 1.2;
    }

    .input-wrap {
      position: relative;
    }

    #answerInput {
      width: 100%;
      padding: 1rem 1.2rem;
      font-size: 1.3rem;
      background: #1a1a2e;
      border: 2px solid #3a3a5c;
      border-radius: 14px;
      color: #e8e8f0;
      outline: none;
      transition: border-color 0.2s;
      text-align: center;
      letter-spacing: 0.04em;
    }

    #answerInput:focus { border-color: #a78bfa; }
    #answerInput.correct-input { border-color: #34d399; background: #0a2a1a; }
    #answerInput.wrong-input   { border-color: #f87171; background: #2a0a0a; }

    .feedback-box {
      min-height: 2.5rem;
      text-align: center;
    }

    .diff-display {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      line-height: 1.8;
    }

    .diff-display .ok   { color: #34d399; }
    .diff-display .bad  { color: #f87171; text-decoration: underline; }
    .diff-display .miss { color: #f87171; font-style: italic; }

    .feedback-msg {
      font-size: 0.9rem;
      margin-top: 0.4rem;
    }

    .btn-row {
      display: flex; gap: 0.8rem; justify-content: center;
    }

    .btn {
      padding: 0.7rem 2rem;
      border: none; border-radius: 11px;
      font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
    }

    .btn-primary { background: #a78bfa; color: #fff; }
    .btn-primary:hover { background: #9270f0; }
    .btn-ghost { background: #1e1e30; color: #a0a0c0; border: 1px solid #2e2e48; }
    .btn-ghost:hover { background: #252540; }
    .btn-green { background: #34d399; color: #0a1f14; }
    .btn-green:hover { background: #2ec48d; }

    /* ── RESULTS ── */
    .results-area { display: none; flex-direction: column; align-items: center; gap: 1.4rem; }
    .results-area.visible { display: flex; }

    .result-big {
      font-size: 3.5rem; text-align: center;
    }

    .result-score {
      font-size: 1.8rem; font-weight: 700;
      color: #a78bfa; text-align: center;
    }

    .result-sub { color: #7c7c9a; font-size: 0.9rem; text-align: center; }

    .mistakes-list {
      width: 100%;
      display: flex; flex-direction: column; gap: 0.5rem;
    }

    .mistake-row {
      display: flex; align-items: center; justify-content: space-between;
      background: #1e1e38; border: 1px solid #3a3a5c;
      border-radius: 12px; padding: 0.9rem 1.2rem;
    }

    .mistake-row .mhe {
      font-size: 1.1rem; color: #c4b5fd; direction: rtl;
      font-family: 'David Libre', 'Times New Roman', serif;
    }

    .mistake-row .men { font-size: 0.95rem; color: #e8e8f0; }
    .mistake-row .myou { font-size: 0.9rem; color: #f87171; }

    .mistake-label { font-size: 0.75rem; color: #6b6b8a; margin-bottom: 0.1rem; }

    /* ── LIST ── */
    .word-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.9rem 1.3rem;
      background: #1a1a2e; border: 1px solid #2a2a40;
      border-radius: 12px;
    }

    .word-row .num { font-size: 0.72rem; color: #44445a; width: 1.5rem; }
    .word-row .en  { font-size: 1rem; color: #c8c8e8; font-weight: 500; }
    .word-row .he  {
      font-size: 1.15rem; color: #c4b5fd; direction: rtl;
      font-family: 'David Libre', 'Times New Roman', serif;
    }

    /* ── HINT ── */
    .btn-hint {
      background: #2a2a1a;
      color: #facc15;
      border: 1px solid #4a4a1a;
    }
    .btn-hint:hover:not(:disabled) { background: #333320; }
    .btn-hint:disabled { opacity: 0.35; cursor: default; }

    .hint-box {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      min-height: 2rem;
      color: #e8e8f0;
    }

    .hint-box .hr { color: #facc15; }
    .hint-box .hb { color: #44445a; }
  </style>
</head>
<body>

<header>
  <h1>English Dictation</h1>
  <p>Time Expressions — See the Hebrew, type the English</p>
  <div class="tabs">
    <button class="tab active" onclick="switchMode('dict')">Practice</button>
    <button class="tab" onclick="switchMode('list')">Word List</button>
  </div>
</header>

<main>

  <!-- DICTATION -->
  <div class="area visible" id="dictArea">
    <div class="top-row">
      <span id="dictCounter">1 / 12</span>
      <span class="score-badge" id="dictScore">✓ 0 &nbsp; ✗ 0</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-fill" id="dictProgress" style="width:8.33%"></div>
    </div>

    <div class="he-card">
      <div class="he-label">Hebrew</div>
      <div class="he-word" id="dictHe"></div>
    </div>

    <div class="input-wrap">
      <input
        id="answerInput"
        type="text"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
        placeholder="type in English…"
        onkeydown="handleKey(event)"
      />
    </div>

    <div class="hint-box" id="hintBox"></div>

    <div class="feedback-box" id="feedbackBox"></div>

    <div class="btn-row">
      <button class="btn btn-ghost"  id="skipBtn"  onclick="skipWord()">Skip</button>
      <button class="btn btn-hint"   id="hintBtn"  onclick="showHint()">💡 Hint <span id="hintCount">×2</span></button>
      <button class="btn btn-primary" id="checkBtn" onclick="checkAnswer()">Check</button>
      <button class="btn btn-green"   id="nextBtn"  onclick="nextWord()" style="display:none">Next →</button>
    </div>
  </div>

  <!-- RESULTS -->
  <div class="results-area" id="resultsArea">
    <div class="result-big" id="resultEmoji"></div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-sub" id="resultSub"></div>
    <div class="mistakes-list" id="mistakesList"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="retryMistakes()" id="retryBtn">Retry mistakes</button>
      <button class="btn btn-primary" onclick="restartFull()">Start over</button>
    </div>
  </div>

  <!-- WORD LIST -->
  <div class="area" id="listArea"></div>

</main>

<script>
const ALL_WORDS = [
  { en: 'in the morning',        he: 'בבוקר'       },
  { en: 'in the afternoon',      he: 'בצהריים'     },
  { en: 'in the evening',        he: 'בערב'        },
  { en: 'at night',              he: 'בלילה'       },
  { en: 'tonight',               he: 'הלילה'       },
  { en: 'at the weekend',        he: 'בסוף שבוע'   },
  { en: 'tomorrow',              he: 'מחר'         },
  { en: 'today',                 he: 'היום'        },
  { en: 'the day after tomorrow', he: 'מחרתיים'    },
  { en: 'early',                 he: 'מוקדם'       },
  { en: 'late',                  he: 'מאוחר'       },
];

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }


let queue = [];
let idx = 0;
let correct = 0;
let wrong = 0;
let mistakes = [];   // {word, typed}
let revealed = false;
let hintLevel = 0;   // 0 = none, 1 = first hint, 2 = second hint

function startDict(wordList) {
  queue    = shuffle(wordList);
  idx      = 0; correct = 0; wrong = 0;
  mistakes = []; revealed = false;
  renderDict();
}

function renderDict() {
  const w = queue[idx];
  document.getElementById('dictHe').textContent   = w.he;
  document.getElementById('dictCounter').textContent = `${idx + 1} / ${queue.length}`;
  document.getElementById('dictProgress').style.width  = `${((idx + 1) / queue.length) * 100}%`;
  document.getElementById('dictScore').innerHTML  = `✓ ${correct} &nbsp; ✗ ${wrong}`;

  const inp = document.getElementById('answerInput');
  inp.value = '';
  inp.className = '';
  inp.disabled = false;
  inp.focus();

  document.getElementById('feedbackBox').innerHTML = '';
  document.getElementById('hintBox').innerHTML     = '';
  document.getElementById('checkBtn').style.display = 'inline-block';
  document.getElementById('skipBtn').style.display  = 'inline-block';
  document.getElementById('hintBtn').style.display  = 'inline-block';
  document.getElementById('hintBtn').disabled       = false;
  document.getElementById('nextBtn').style.display  = 'none';
  hintLevel = 0;
  document.getElementById('hintCount').textContent = '×2';
  revealed = false;

}

function handleKey(e) {
  if (e.key === 'Enter') {
    if (document.getElementById('nextBtn').style.display !== 'none') nextWord();
    else checkAnswer();
  }
}

function normalize(s) { return s.trim().toLowerCase().replace(/\s+/g, ' '); }

function checkAnswer() {
  const inp   = document.getElementById('answerInput');
  const typed = normalize(inp.value);
  if (!typed) { inp.focus(); return; }

  const correct_ans = queue[idx].en;
  const isCorrect   = typed === normalize(correct_ans);

  inp.disabled = true;
  document.getElementById('checkBtn').style.display = 'none';
  document.getElementById('skipBtn').style.display  = 'none';
  document.getElementById('hintBtn').style.display  = 'none';
  document.getElementById('nextBtn').style.display  = 'inline-block';

  if (isCorrect) {
    inp.classList.add('correct-input');
    correct++;
    document.getElementById('feedbackBox').innerHTML =
      `<div class="diff-display"><span class="ok">${escHtml(correct_ans)}</span></div>
       <div class="feedback-msg" style="color:#34d399">Correct!</div>`;
  } else {
    inp.classList.add('wrong-input');
    wrong++;
    mistakes.push({ word: queue[idx], typed });
    document.getElementById('feedbackBox').innerHTML =
      `<div class="diff-display">${buildDiff(typed, correct_ans)}</div>
       <div class="feedback-msg" style="color:#7c7c9a">Correct: <strong style="color:#e8e8f0">${escHtml(correct_ans)}</strong></div>`;
  }

  document.getElementById('dictScore').innerHTML = `✓ ${correct} &nbsp; ✗ ${wrong}`;
}

function skipWord() {
  const correct_ans = queue[idx].en;
  wrong++;
  mistakes.push({ word: queue[idx], typed: '' });
  const inp = document.getElementById('answerInput');
  inp.disabled = true;
  inp.classList.add('wrong-input');
  document.getElementById('checkBtn').style.display = 'none';
  document.getElementById('skipBtn').style.display  = 'none';
  document.getElementById('hintBtn').style.display  = 'none';
  document.getElementById('nextBtn').style.display  = 'inline-block';
  document.getElementById('feedbackBox').innerHTML  =
    `<div class="feedback-msg" style="color:#7c7c9a">Answer: <strong style="color:#e8e8f0">${escHtml(correct_ans)}</strong></div>`;
  document.getElementById('dictScore').innerHTML = `✓ ${correct} &nbsp; ✗ ${wrong}`;
}

function nextWord() {
  idx++;
  if (idx >= queue.length) { showResults(); return; }
  renderDict();
}

function showHint() {
  if (hintLevel >= 2) return;
  hintLevel++;

  const ans   = queue[idx].en;
  const hintEl = document.getElementById('hintBox');
  hintEl.innerHTML = buildHintDisplay(ans, hintLevel);

  const remaining = 2 - hintLevel;
  const countEl = document.getElementById('hintCount');
  if (remaining === 1) {
    countEl.textContent = '×1';
  } else {
    document.getElementById('hintBtn').disabled = true;
    countEl.textContent = '×0';
  }

  document.getElementById('answerInput').focus();
}

function buildHintDisplay(answer, level) {
  // Split into words, reveal:
  // level 1 → first letter of each word
  // level 2 → first letter + last letter of each word
  return answer.split(' ').map(word => {
    return word.split('').map((ch, i) => {
      const reveal =
        (level >= 1 && i === 0) ||
        (level >= 2 && i === word.length - 1);
      return reveal
        ? `<span class="hr">${escHtml(ch)}</span>`
        : `<span class="hb">_</span>`;
    }).join('');
  }).join('<span style="display:inline-block;width:.6em"> </span>');
}

function buildDiff(typed, correct) {
  let out = '';
  const t = typed;
  const c = correct;
  const len = Math.max(t.length, c.length);
  for (let i = 0; i < len; i++) {
    if (i >= t.length) {
      out += `<span class="miss">${escHtml(c[i])}</span>`;
    } else if (i >= c.length) {
      out += `<span class="bad">${escHtml(t[i])}</span>`;
    } else if (t[i].toLowerCase() === c[i].toLowerCase()) {
      out += `<span class="ok">${escHtml(c[i])}</span>`;
    } else {
      out += `<span class="bad">${escHtml(t[i])}</span>`;
    }
  }
  return out;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showResults() {
  document.getElementById('dictArea').classList.remove('visible');
  const res = document.getElementById('resultsArea');
  res.classList.add('visible');

  const total = queue.length;
  const pct   = Math.round((correct / total) * 100);
  document.getElementById('resultEmoji').textContent =
    pct === 100 ? '🏆' : pct >= 70 ? '👍' : '📝';
  document.getElementById('resultScore').textContent = `${correct} / ${total} correct`;
  document.getElementById('resultSub').textContent   = `${pct}% — ${pct===100?'Perfect!':pct>=70?'Good job!':'Keep practicing!'}`;

  const retryBtn = document.getElementById('retryBtn');
  retryBtn.style.display = mistakes.length ? 'inline-block' : 'none';

  const ml = document.getElementById('mistakesList');
  ml.innerHTML = '';
  if (mistakes.length) {
    const h = document.createElement('div');
    h.style.cssText = 'font-size:.78rem;color:#7c7c9a;text-align:center;text-transform:uppercase;letter-spacing:.1em;';
    h.textContent = 'Words to review';
    ml.appendChild(h);
    mistakes.forEach(m => {
      const row = document.createElement('div');
      row.className = 'mistake-row';
      row.innerHTML = `
        <div>
          <div class="mistake-label">Hebrew</div>
          <div class="mhe">${escHtml(m.word.he)}</div>
        </div>
        <div style="text-align:right">
          <div class="mistake-label">Correct</div>
          <div class="men">${escHtml(m.word.en)}</div>
          ${m.typed ? `<div class="myou">You wrote: ${escHtml(m.typed)}</div>` : '<div class="myou">skipped</div>'}
        </div>
      `;
      ml.appendChild(row);
    });
  }
}

function retryMistakes() {
  const missedWords = mistakes.map(m => m.word);
  document.getElementById('resultsArea').classList.remove('visible');
  document.getElementById('dictArea').classList.add('visible');
  startDict(missedWords);
}

function restartFull() {
  document.getElementById('resultsArea').classList.remove('visible');
  document.getElementById('dictArea').classList.add('visible');
  startDict(ALL_WORDS);
}

// ── LIST ──
function buildList() {
  const area = document.getElementById('listArea');
  area.innerHTML = '';
  ALL_WORDS.forEach((w, i) => {
    const row = document.createElement('div');
    row.className = 'word-row';
    row.innerHTML = `
      <span class="num">${i+1}</span>
      <span class="en">${escHtml(w.en)}</span>
      <span class="he">${escHtml(w.he)}</span>
    `;
    area.appendChild(row);
  });
}

// ── MODE ──
function switchMode(mode) {
  document.querySelectorAll('.tab').forEach((t,i) =>
    t.classList.toggle('active', ['dict','list'][i] === mode));

  document.getElementById('dictArea').classList.toggle('visible', mode === 'dict');
  document.getElementById('resultsArea').classList.toggle('visible', false);
  document.getElementById('listArea').classList.toggle('visible', mode === 'list');

  if (mode === 'list') buildList();
  if (mode === 'dict') {
    startDict(ALL_WORDS);
  }
}

// init
startDict(ALL_WORDS);
</script>
</body>
</html>
