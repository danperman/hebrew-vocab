<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hebrew Verbs — Dictation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f1a;
      color: #e8e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      text-align: center;
      padding: 2rem 1rem 1rem;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-bottom: 1px solid #2a2a4a;
    }

    header h1 {
      font-size: 1.8rem;
      color: #a78bfa;
      letter-spacing: 0.05em;
    }

    header p {
      color: #7c7c9a;
      margin-top: 0.3rem;
      font-size: 0.9rem;
    }

    /* Mode tabs */
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin: 1.5rem 0 0;
      background: #16213e;
      padding: 0.3rem;
      border-radius: 12px;
    }

    .tab {
      padding: 0.5rem 1.2rem;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: #7c7c9a;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .tab.active {
      background: #a78bfa;
      color: #fff;
      font-weight: 600;
    }

    main {
      width: 100%;
      max-width: 700px;
      padding: 2rem 1rem;
    }

    /* ── FLASHCARD MODE ── */
    .flashcard-area { display: none; flex-direction: column; align-items: center; gap: 1.5rem; }
    .flashcard-area.visible { display: flex; }

    .progress-bar-wrap {
      width: 100%;
      background: #1e1e30;
      border-radius: 99px;
      height: 6px;
    }

    .progress-bar {
      height: 6px;
      background: #a78bfa;
      border-radius: 99px;
      transition: width 0.4s ease;
    }

    .progress-text {
      font-size: 0.8rem;
      color: #7c7c9a;
      align-self: flex-end;
    }

    .card-scene {
      width: 100%;
      height: 220px;
      perspective: 1000px;
      cursor: pointer;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.4,0,0.2,1);
    }

    .card.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      user-select: none;
    }

    .card-front {
      background: linear-gradient(135deg, #1e1e38 0%, #252545 100%);
      border: 1px solid #3a3a5c;
    }

    .card-back {
      background: linear-gradient(135deg, #2d1b4e 0%, #3b2060 100%);
      border: 1px solid #6d4ab0;
      transform: rotateY(180deg);
    }

    .card-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #6b6b8a;
      margin-bottom: 0.8rem;
    }

    .card-word-en {
      font-size: 2rem;
      font-weight: 700;
      color: #e8e8f0;
    }

    .card-word-he {
      font-size: 2.4rem;
      font-weight: 700;
      color: #c4b5fd;
      direction: rtl;
      font-family: 'David Libre', 'Times New Roman', serif;
    }

    .card-hint {
      margin-top: 0.6rem;
      font-size: 0.8rem;
      color: #6b6b8a;
    }

    .nav-row {
      display: flex;
      gap: 1rem;
      width: 100%;
      justify-content: center;
    }

    .btn {
      padding: 0.65rem 1.8rem;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-ghost {
      background: #1e1e30;
      color: #a0a0c0;
      border: 1px solid #2e2e48;
    }

    .btn-ghost:hover { background: #252540; }

    .btn-primary {
      background: #a78bfa;
      color: #fff;
    }

    .btn-primary:hover { background: #9270f0; }

    .btn-success { background: #34d399; color: #0f2a1e; }
    .btn-danger  { background: #f87171; color: #2a0a0a; }

    /* ── QUIZ MODE ── */
    .quiz-area { display: none; flex-direction: column; gap: 1.5rem; }
    .quiz-area.visible { display: flex; }

    .quiz-question {
      text-align: center;
      background: #1e1e38;
      border: 1px solid #3a3a5c;
      border-radius: 20px;
      padding: 2rem;
    }

    .quiz-question .qlabel {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #6b6b8a;
      margin-bottom: 0.8rem;
    }

    .quiz-question .qword {
      font-size: 2rem;
      font-weight: 700;
      color: #e8e8f0;
    }

    .quiz-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .opt-btn {
      padding: 1rem;
      border-radius: 12px;
      border: 1px solid #3a3a5c;
      background: #1e1e38;
      color: #e8e8f0;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.15s;
      direction: rtl;
      font-family: 'David Libre', 'Times New Roman', serif;
    }

    .opt-btn:hover:not(:disabled) { border-color: #a78bfa; background: #252548; }
    .opt-btn.correct { background: #14532d; border-color: #34d399; color: #86efac; }
    .opt-btn.wrong   { background: #450a0a; border-color: #f87171; color: #fca5a5; }
    .opt-btn:disabled { cursor: default; }

    .quiz-feedback {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
      min-height: 1.5rem;
      color: #a78bfa;
    }

    .quiz-score {
      text-align: center;
      color: #7c7c9a;
      font-size: 0.9rem;
    }

    /* ── LIST MODE ── */
    .list-area { display: none; flex-direction: column; gap: 0.5rem; }
    .list-area.visible { display: flex; }

    .word-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.4rem;
      background: #1a1a2e;
      border: 1px solid #2a2a40;
      border-radius: 12px;
      transition: border-color 0.15s;
    }

    .word-row:hover { border-color: #a78bfa44; }

    .word-row .en {
      font-size: 1.05rem;
      color: #c8c8e8;
      font-weight: 500;
    }

    .word-row .num {
      font-size: 0.75rem;
      color: #44445a;
      width: 1.5rem;
    }

    .word-row .he {
      font-size: 1.2rem;
      color: #c4b5fd;
      direction: rtl;
      font-family: 'David Libre', 'Times New Roman', serif;
    }

    /* finish screen */
    .finish-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 3rem 1rem;
      text-align: center;
    }

    .finish-screen.visible { display: flex; }

    .finish-screen .big { font-size: 4rem; }
    .finish-screen h2 { font-size: 1.6rem; color: #a78bfa; }
    .finish-screen p { color: #7c7c9a; }
  </style>
</head>
<body>

<header>
  <h1>Hebrew Verbs</h1>
  <p>Dictation — 12 words</p>
  <div class="tabs">
    <button class="tab active" onclick="switchMode('flash')">Flashcards</button>
    <button class="tab" onclick="switchMode('quiz')">Quiz</button>
    <button class="tab" onclick="switchMode('list')">Full List</button>
  </div>
</header>

<main>

  <!-- FLASHCARD MODE -->
  <div class="flashcard-area visible" id="flashArea">
    <span class="progress-text" id="flashCounter">1 / 12</span>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="flashProgress" style="width:8.33%"></div>
    </div>

    <div class="card-scene" onclick="flipCard()">
      <div class="card" id="theCard">
        <div class="card-face card-front">
          <div class="card-label">English</div>
          <div class="card-word-en" id="frontWord"></div>
          <div class="card-hint">tap to reveal Hebrew</div>
        </div>
        <div class="card-face card-back">
          <div class="card-label">Hebrew</div>
          <div class="card-word-he" id="backWord"></div>
          <div class="card-hint" id="backEn"></div>
        </div>
      </div>
    </div>

    <div class="nav-row">
      <button class="btn btn-ghost" onclick="prevCard()">← Back</button>
      <button class="btn btn-primary" onclick="nextCard()">Next →</button>
    </div>
  </div>

  <!-- QUIZ MODE -->
  <div class="quiz-area" id="quizArea">
    <div class="quiz-score" id="quizScore">Score: 0 / 0</div>
    <div class="quiz-question">
      <div class="qlabel">What is the Hebrew for…</div>
      <div class="qword" id="quizWord"></div>
    </div>
    <div class="quiz-options" id="quizOptions"></div>
    <div class="quiz-feedback" id="quizFeedback"></div>
    <div class="nav-row">
      <button class="btn btn-primary" id="quizNextBtn" onclick="nextQuiz()" style="display:none">Next →</button>
    </div>
  </div>

  <!-- LIST MODE -->
  <div class="list-area" id="listArea"></div>

  <!-- FINISH -->
  <div class="finish-screen" id="finishScreen">
    <div class="big">🎉</div>
    <h2 id="finishTitle"></h2>
    <p id="finishSub"></p>
    <button class="btn btn-primary" onclick="restart()">Try again</button>
  </div>

</main>

<script>
const words = [
  { en: 'to leave',    he: 'לעזוב'    },
  { en: 'to bring',    he: 'להביא'    },
  { en: 'to visit',    he: 'לבקר'     },
  { en: 'to take',     he: 'לקחת'     },
  { en: 'to study',    he: 'ללמוד'    },
  { en: 'to wait',     he: 'לחכות'    },
  { en: 'to write',    he: 'לכתוב'    },
  { en: 'to hear',     he: 'לשמוע'    },
  { en: 'to practice', he: 'להתאמן'   },
  { en: 'to travel',   he: 'לנסוע'    },
  { en: 'to listen',   he: 'להקשיב'   },
  { en: 'to think',    he: 'לחשוב'    },
];

// ── FLASHCARD ──
let flashIdx = 0;
let flipped = false;

function renderCard() {
  const w = words[flashIdx];
  document.getElementById('frontWord').textContent = w.en;
  document.getElementById('backWord').textContent  = w.he;
  document.getElementById('backEn').textContent    = w.en;
  document.getElementById('flashCounter').textContent = `${flashIdx + 1} / ${words.length}`;
  document.getElementById('flashProgress').style.width = `${((flashIdx + 1) / words.length) * 100}%`;
  const card = document.getElementById('theCard');
  card.classList.remove('flipped');
  flipped = false;
}

function flipCard() {
  flipped = !flipped;
  document.getElementById('theCard').classList.toggle('flipped', flipped);
}

function nextCard() {
  if (flashIdx < words.length - 1) { flashIdx++; renderCard(); }
  else { showFinish('Flashcards done!', `You reviewed all ${words.length} words.`); }
}

function prevCard() {
  if (flashIdx > 0) { flashIdx--; renderCard(); }
}

// ── QUIZ ──
let quizIdx = 0;
let quizOrder = [];
let score = 0;
let answered = false;

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function startQuiz() {
  quizOrder = shuffle(words);
  quizIdx = 0; score = 0; answered = false;
  renderQuiz();
}

function renderQuiz() {
  if (quizIdx >= quizOrder.length) {
    showFinish('Quiz complete!', `You scored ${score} out of ${quizOrder.length}.`);
    return;
  }
  answered = false;
  document.getElementById('quizFeedback').textContent = '';
  document.getElementById('quizNextBtn').style.display = 'none';
  document.getElementById('quizScore').textContent = `Score: ${score} / ${quizIdx}`;

  const current = quizOrder[quizIdx];
  document.getElementById('quizWord').textContent = current.en;

  // 4 options: correct + 3 random others
  const others = shuffle(words.filter(w => w.he !== current.he)).slice(0, 3);
  const options = shuffle([current, ...others]);

  const container = document.getElementById('quizOptions');
  container.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt.he;
    btn.onclick = () => checkAnswer(opt.he, current.he, btn);
    container.appendChild(btn);
  });
}

function checkAnswer(chosen, correct, btn) {
  if (answered) return;
  answered = true;
  const allBtns = document.querySelectorAll('.opt-btn');
  allBtns.forEach(b => {
    b.disabled = true;
    if (b.textContent === correct) b.classList.add('correct');
  });
  if (chosen === correct) {
    score++;
    document.getElementById('quizFeedback').textContent = '✓ Correct!';
    document.getElementById('quizFeedback').style.color = '#34d399';
  } else {
    btn.classList.add('wrong');
    document.getElementById('quizFeedback').textContent = `✗ The answer is ${correct}`;
    document.getElementById('quizFeedback').style.color = '#f87171';
  }
  document.getElementById('quizNextBtn').style.display = 'inline-block';
}

function nextQuiz() { quizIdx++; renderQuiz(); }

// ── LIST ──
function buildList() {
  const area = document.getElementById('listArea');
  area.innerHTML = '';
  words.forEach((w, i) => {
    const row = document.createElement('div');
    row.className = 'word-row';
    row.innerHTML = `
      <span class="num">${i + 1}</span>
      <span class="en">${w.en}</span>
      <span class="he">${w.he}</span>
    `;
    area.appendChild(row);
  });
}

// ── MODE SWITCH ──
let currentMode = 'flash';

function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['flash','quiz','list'][i] === mode);
  });
  document.getElementById('flashArea').classList.toggle('visible', mode === 'flash');
  document.getElementById('quizArea').classList.toggle('visible', mode === 'quiz');
  document.getElementById('listArea').classList.toggle('visible', mode === 'list');
  document.getElementById('finishScreen').classList.remove('visible');

  if (mode === 'quiz') startQuiz();
  if (mode === 'list') buildList();
  if (mode === 'flash') { flashIdx = 0; renderCard(); }
}

function showFinish(title, sub) {
  document.getElementById('flashArea').classList.remove('visible');
  document.getElementById('quizArea').classList.remove('visible');
  document.getElementById('finishScreen').classList.add('visible');
  document.getElementById('finishTitle').textContent = title;
  document.getElementById('finishSub').textContent = sub;
}

function restart() {
  document.getElementById('finishScreen').classList.remove('visible');
  switchMode(currentMode);
}

// init
renderCard();
</script>
</body>
</html>
